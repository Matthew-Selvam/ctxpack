name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test without tiktoken
        # The estimator must stand on its own; if these fail, ctxpack has
        # accidentally acquired a hard dependency.
        run: pytest -q

      - name: Test with tiktoken
        # Ground-truth comparisons only make sense when tiktoken is present.
        run: |
          pip install -e ".[exact]"
          pytest -q

      - name: CLI smoke test
        run: |
          ctxpack --version
          # Config file, including the precedence that is easy to get wrong.
          printf 'budget = 20000\nmode = "coverage"\n' > ctxpack.toml
          ctxpack . -o /dev/null --stats --show-config
          ctxpack . -b 5000 -o /dev/null --stats
          rm ctxpack.toml
          # Every feature flag, once.
          ctxpack . -b 8000 --reach-weight 3 -q -f tree
          ctxpack . -b 8000 --outline -q -f tree
          ctxpack . -b 8000 --factor-shared -q -f tree
          ctxpack . --diff HEAD -b 8000 -q -f tree
          ctxpack . -b 20000 -o bundle.md --stats
          ctxpack . -b 8000 -f xml -o bundle.xml
          ctxpack . -b 8000 -f json -o bundle.json
          ctxpack . -b 8000 -f tree
          ctxpack count . -n 5
          ctxpack explain . -n 3
          ctxpack calibrate . -n 20
          # The bundle must never exceed its budget.
          python - <<'PY'
          from pathlib import Path
          from ctxpack.tokens import Tokenizer
          budget = 20000
          used = Tokenizer().count(Path("bundle.md").read_text()).tokens
          # Header and formatting overhead is not part of the accounted total.
          slack = int(budget * 0.10) + 500
          assert used <= budget + slack, f"{used} > {budget} + {slack}"
          print(f"bundle.md is {used} tokens against a {budget} budget")
          PY

  install:
    name: install / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          pip install --upgrade pip build
          python -m build

      - name: Check the wheel installs and runs
        run: |
          pip install dist/*.whl
          ctxpack --version
          ctxpack . -b 4000 -q | head -1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ruff
        run: |
          pip install ruff
          ruff check src tests scripts

      - name: Compile all
        run: python -m compileall -q src scripts

  bench:
    name: bench (invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[exact]"

      # Runs entirely on synthetic repo shapes, so it needs no corpus and is
      # deterministic. It is the canary for two things the unit tests cannot
      # assert on a fixed fixture: that no budget is ever exceeded across a
      # spread of repo shapes, and that every rendered format still parses when
      # fed deliberately hostile content.
      - name: Packing invariants and render integrity
        run: |
          python scripts/bench.py --synthetic --baseline bench-baseline.json --check

      - name: Estimator accuracy against tiktoken
        # Needs a real corpus, so this clones one small repo rather than
        # depending on whatever happens to be checked out.
        run: |
          git clone --depth 1 https://github.com/psf/requests
          python scripts/bench.py --root requests --baseline /tmp/bench.json --write
          python scripts/bench.py --root requests --baseline /tmp/bench.json --check
          echo "accuracy on a fresh corpus:"
          python scripts/bench.py --root requests 2>/dev/null | head -12